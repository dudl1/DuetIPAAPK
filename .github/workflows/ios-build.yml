name: Expo Prebuild & iOS Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      # Генерируем папку ios в облаке
      - name: Run Expo Prebuild for iOS
        run: npx expo prebuild --platform ios --no-install

      # Выводим список файлов, чтобы точно знать имя проекта в логах
      - name: List iOS directory
        run: ls -la ios

      # Собираем JS-код приложения внутрь папки ios
      - name: Export Expo Embed bundle
        run: npx expo export:embed --entry-file=node_modules/expo-router/entry.js --bundle-output=./ios/main.jsbundle --dev=false --platform=ios

      # Компилируем .app без подписи (автоматический поиск workspace и scheme)
      - name: Build Xcode Project
        run: |
          cd ios
          WORKSPACE_FILE=$(ls -d *.xcworkspace)
          SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          echo "Found Workspace: $WORKSPACE_FILE"
          echo "Found Scheme: $SCHEME_NAME"
          xcodebuild -workspace "$WORKSPACE_FILE" -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Упаковываем полученный .app в формат .ipa
      - name: Create Unsigned IPA Pack
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r App.ipa Payload/

      # Загружаем готовый .ipa для скачивания в Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: build/App.ipa
